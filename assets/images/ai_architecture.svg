<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="voiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filters for Glow / Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
    .font-subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .font-card-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; }
    .font-step-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #f1f5f9; }
    .font-step-desc { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .font-badge { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .node-border { stroke-width: 1.5; }
    .connector-line { stroke-width: 2; stroke-dasharray: 4,4; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1100" height="680" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Header Banner -->
  <g transform="translate(40, 32)">
    <text x="0" y="24" class="font-title" font-size="22">🤖 HarvestHub — 3 Core AI Engines Architecture</text>
    <text x="0" y="46" class="font-subtitle">On-Device Intelligence + Google Gemini API with Zero Cloud Storage Overhead</text>
  </g>

  <!-- Top User Node -->
  <g transform="translate(425, 95)" filter="url(#shadow)">
    <rect width="250" height="52" rx="26" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <circle cx="28" cy="26" r="16" fill="#3b82f6" />
    <text x="28" y="31" text-anchor="middle" font-size="14">👨‍🌾🛒</text>
    <text x="56" y="26" class="font-step-title" font-size="13">Active User Interaction</text>
    <text x="56" y="40" class="font-step-desc">Farmer Produce / Urban Customer</text>
  </g>

  <!-- Connecting Lines from Top to 3 Columns -->
  <path d="M 550 147 L 550 170 L 205 170 L 205 195" fill="none" stroke="#10b981" stroke-width="2" />
  <path d="M 550 147 L 550 195" fill="none" stroke="#06b6d4" stroke-width="2" />
  <path d="M 550 147 L 550 170 L 895 170 L 895 195" fill="none" stroke="#f59e0b" stroke-width="2" />

  <!-- ================= COLUMN 1: VOICE DUKAAN ================= -->
  <g transform="translate(50, 195)" filter="url(#shadow)">
    <!-- Main Column Card -->
    <rect width="310" height="450" rx="14" fill="url(#cardGrad1)" stroke="#10b981" class="node-border" />
    
    <!-- Header -->
    <rect width="310" height="42" rx="14" fill="#10b981" fill-opacity="0.15" />
    <text x="16" y="26" class="font-card-title" fill="#34d399">🎙️ 1. Awaaz se Dukaan</text>
    <rect x="220" y="12" width="75" height="18" rx="9" fill="#10b981" />
    <text x="257" y="24" text-anchor="middle" class="font-badge" fill="#ffffff">Voice NLU</text>

    <!-- Step 1: Input -->
    <g transform="translate(16, 56)">
      <rect width="278" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" class="font-step-title">1. Spoken Audio Input</text>
      <text x="14" y="42" class="font-step-desc">Roman Urdu / Urdu / English</text>
      <text x="14" y="54" class="font-step-desc" fill="#64748b" font-style="italic">"20 kg tamatar 150 rupay kilo..."</text>
    </g>

    <!-- Arrow -->
    <line x1="155" y1="122" x2="155" y2="138" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 2: Gemini API -->
    <g transform="translate(16, 142)">
      <rect width="278" height="68" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="24" class="font-step-title">2. Google Gemini Flash</text>
      <text x="14" y="42" class="font-step-desc">Extracts commodity, qty, unit, &amp; price</text>
      <text x="14" y="57" class="font-step-desc" fill="#34d399">Cascade: 3.5-lite ➔ 3.6 ➔ 2.5</text>
    </g>

    <!-- Arrow -->
    <line x1="155" y1="216" x2="155" y2="232" stroke="#10b981" stroke-width="2" />

    <!-- Step 3: Dart Engine -->
    <g transform="translate(16, 236)">
      <rect width="278" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" class="font-step-title">3. Dart Validation Engine</text>
      <text x="14" y="42" class="font-step-desc">Sanity rules, stock bounds, typo check</text>
      <text x="14" y="57" class="font-step-desc" fill="#94a3b8">Prevents extreme / bogus values</text>
    </g>

    <!-- Arrow -->
    <line x1="155" y1="310" x2="155" y2="326" stroke="#10b981" stroke-width="2" />

    <!-- Step 4: Output -->
    <g transform="translate(16, 330)">
      <rect width="278" height="74" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="14" y="24" class="font-step-title" fill="#a7f3d0">✅ Live Marketplace Listing</text>
      <text x="14" y="44" class="font-step-desc" fill="#ecfdf5">Draft prepared in 2 seconds.</text>
      <text x="14" y="60" class="font-step-desc" fill="#6ee7b7">Zero typing required by rural farmer</text>
    </g>
  </g>

  <!-- ================= COLUMN 2: CROP DOCTOR ================= -->
  <g transform="translate(395, 195)" filter="url(#shadow)">
    <!-- Main Column Card -->
    <rect width="310" height="450" rx="14" fill="url(#cardGrad1)" stroke="#06b6d4" class="node-border" />
    
    <!-- Header -->
    <rect width="310" height="42" rx="14" fill="#06b6d4" fill-opacity="0.15" />
    <text x="16" y="26" class="font-card-title" fill="#22d3ee">🩺 2. Crop Doctor</text>
    <rect x="210" y="12" width="85" height="18" rx="9" fill="#06b6d4" />
    <text x="252" y="24" text-anchor="middle" class="font-badge" fill="#ffffff">Vision AI</text>

    <!-- Step 1: Input -->
    <g transform="translate(16, 56)">
      <rect width="278" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" class="font-step-title">1. Camera / Leaf Scan</text>
      <text x="14" y="42" class="font-step-desc">Non-plant detection filter built-in</text>
      <text x="14" y="54" class="font-step-desc" fill="#22d3ee">In-memory Base64 (No Cloud Store)</text>
    </g>

    <!-- Arrow -->
    <line x1="155" y1="122" x2="155" y2="138" stroke="#06b6d4" stroke-width="2" />

    <!-- Step 2: Gemini API -->
    <g transform="translate(16, 142)">
      <rect width="278" height="68" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" />
      <text x="14" y="24" class="font-step-title">2. Gemini Multimodal Vision</text>
      <text x="14" y="42" class="font-step-desc">Identifies pathogen, disease &amp; severity</text>
      <text x="14" y="57" class="font-step-desc" fill="#22d3ee">English + Roman Urdu explanations</text>
    </g>

    <!-- Arrow -->
    <line x1="155" y1="216" x2="155" y2="232" stroke="#06b6d4" stroke-width="2" />

    <!-- Step 3: Safety Filter -->
    <g transform="translate(16, 236)">
      <rect width="278" height="68" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" />
      <text x="14" y="24" class="font-step-title" fill="#fda4af">3. Chemical Stripping Filter</text>
      <text x="14" y="42" class="font-step-desc">Strips harmful pesticides &amp; dosages</text>
      <text x="14" y="57" class="font-step-desc" fill="#f43f5e">Pure organic &amp; cultural remedies only</text>
    </g>

    <!-- Arrow -->
    <line x1="155" y1="310" x2="155" y2="326" stroke="#06b6d4" stroke-width="2" />

    <!-- Step 4: Output -->
    <g transform="translate(16, 330)">
      <rect width="278" height="74" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1.5" />
      <text x="14" y="24" class="font-step-title" fill="#a5f3fc">🌱 Safe Pathologist Report</text>
      <text x="14" y="44" class="font-step-desc" fill="#ecfeff">Step-by-step sunlight, pruning, watering.</text>
      <text x="14" y="60" class="font-step-desc" fill="#67e8f9">Instant advice with zero storage bill</text>
    </g>
  </g>

  <!-- ================= COLUMN 3: SMART BASKET ================= -->
  <g transform="translate(740, 195)" filter="url(#shadow)">
    <!-- Main Column Card -->
    <rect width="310" height="450" rx="14" fill="url(#cardGrad1)" stroke="#f59e0b" class="node-border" />
    
    <!-- Header -->
    <rect width="310" height="42" rx="14" fill="#f59e0b" fill-opacity="0.15" />
    <text x="16" y="26" class="font-card-title" fill="#fbbf24">🧺 3. Smart Basket</text>
    <rect x="210" y="12" width="85" height="18" rx="9" fill="#f59e0b" />
    <text x="252" y="24" text-anchor="middle" class="font-badge" fill="#ffffff">Budget AI</text>

    <!-- Step 1: Input -->
    <g transform="translate(16, 56)">
      <rect width="278" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" class="font-step-title">1. Household Prompt</text>
      <text x="14" y="42" class="font-step-desc">"Rs 3000, 5 log, hafta bhar ki sabzi"</text>
      <text x="14" y="54" class="font-step-desc" fill="#fbbf24">With offline Regex fallback parser</text>
    </g>

    <!-- Arrow -->
    <line x1="155" y1="122" x2="155" y2="138" stroke="#f59e0b" stroke-width="2" />

    <!-- Step 2: Gemini API -->
    <g transform="translate(16, 142)">
      <rect width="278" height="68" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="14" y="24" class="font-step-title">2. Gemini Intent Extraction</text>
      <text x="14" y="42" class="font-step-desc">Extracts item list &amp; requested budget</text>
      <text x="14" y="57" class="font-step-desc" fill="#f59e0b">No catalog or prices sent to AI</text>
    </g>

    <!-- Arrow -->
    <line x1="155" y1="216" x2="155" y2="232" stroke="#f59e0b" stroke-width="2" />

    <!-- Step 3: Dart Engine -->
    <g transform="translate(16, 236)">
      <rect width="278" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" class="font-step-title">3. Stock Clamping &amp; Budget Math</text>
      <text x="14" y="42" class="font-step-desc">Dart live stock checks &amp; price match</text>
      <text x="14" y="57" class="font-step-desc" fill="#fbbf24">Auto-drops low priority if over budget</text>
    </g>

    <!-- Arrow -->
    <line x1="155" y1="310" x2="155" y2="326" stroke="#f59e0b" stroke-width="2" />

    <!-- Step 4: Output -->
    <g transform="translate(16, 330)">
      <rect width="278" height="74" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
      <text x="14" y="24" class="font-step-title" fill="#fde68a">🛒 1-Click Optimized Cart</text>
      <text x="14" y="44" class="font-step-desc" fill="#fef3c7">Fits within exact family wallet limit.</text>
      <text x="14" y="60" class="font-step-desc" fill="#fcd34d">Direct sync with shopping cart</text>
    </g>
  </g>
</svg>
